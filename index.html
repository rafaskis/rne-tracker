<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNE Tracker v58</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --border-color: #334155;
            --badge-bg: rgba(255, 255, 255, 0.08);
        }

        body.light-theme {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --badge-bg: rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .summary-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-red);
            margin-top: 4px;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .category-group {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .category-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background-color: rgba(0,0,0,0.1);
            font-weight: bold;
        }

        .item-card {
            padding: 14px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .item-card.unpaid {
            border-left: 4px solid var(--accent-red);
        }

        .item-card.paid {
            border-left: 4px solid var(--accent-green);
            opacity: 0.6;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .item-amount {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badges-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-custom { background-color: #0284c7; color: white; }
        .badge-edited { background-color: #d97706; color: white; }
        .badge-until { background-color: #4f46e5; color: white; }
        .badge-originated {
            background-color: var(--badge-bg);
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            text-transform: none;
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Option A: Disabled Button Control */
        .btn-action.disabled,
        .btn-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="monthTitle">August 2026</h1>
        <div>
            <button class="btn-action" onclick="exportToPDF()" title="Export PDF">📄</button>
            <button class="btn-action" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
        </div>
    </header>

    <div class="summary-card">
        <div class="summary-title">Total Unpaid for this Month</div>
        <div class="summary-amount" id="totalUnpaidDisplay">€0.00</div>
    </div>

    <button class="btn-add" onclick="addNewExpense()">+ Add New Expense</button>

    <div id="expenseContainer"></div>

    <script>
        // State Initialization
        let state = {
            currentMonthKey: '2026-08',
            minAllowedMonthKey: '2026-08', // Boundary for move backward
            theme: localStorage.getItem('theme') || 'dark',
            expenses: JSON.parse(localStorage.getItem('household_expenses')) || [
                {
                    id: '1',
                    title: 'Εξάρτημα NTK515 (x2)',
                    amount: 120.00,
                    category: 'One-Time Only',
                    paid: false,
                    isCustom: true,
                    originated: '2026-07',
                    monthKey: '2026-08'
                },
                {
                    id: '2',
                    title: 'Test unpaid onetime',
                    amount: 1.00,
                    category: 'One-Time Only',
                    paid: false,
                    originated: '2026-07',
                    monthKey: '2026-08'
                },
                {
                    id: '3',
                    title: 'Test series unpaid oct/26',
                    amount: 1.00,
                    category: 'Monthly',
                    paid: false,
                    originated: '2026-07',
                    until: '2026-10',
                    monthKey: '2026-08'
                }
            ]
        };

        // Utility: Format YYYY-MM into MMM YYYY display
        function formatMonthDisplay(key) {
            if (!key) return '';
            const [year, month] = key.split('-');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[parseInt(month, 10) - 1]} ${year}`;
        }

        // Rule Check: Custom Hiding Rules for Move Left Button
        function shouldHideMoveLeft(item) {
            return item.paid === true; // Example rule: paid items hide move left
        }

        function shouldHideMoveRight(item) {
            return false;
        }

        // Render Badges Independently
        function buildItemBadges(item) {
            let badgesHtml = '';

            if (item.isCustom || item.custom) {
                badgesHtml += `<span class="badge badge-custom">CUSTOM</span>`;
            }

            if (item.isEdited || item.edited) {
                badgesHtml += `<span class="badge badge-edited">EDITED</span>`;
            }

            // Originated tag (rendered independently for all brought-forward items)
            if (item.originated) {
                badgesHtml += `<span class="badge badge-originated">Originated: ${formatMonthDisplay(item.originated)}</span>`;
            }

            // Recurring series end tag
            if (item.until) {
                const [uYr, uMo] = item.until.split('-');
                badgesHtml += `<span class="badge badge-until">Until: ${uMo}/${uYr}</span>`;
            }

            return badgesHtml ? `<div class="badges-container">${badgesHtml}</div>` : '';
        }

        // Render Action Buttons with Boundary Logic (Option A)
        function renderCardActionButtons(item) {
            let moveLeftButtonHtml = '';

            // 1. Preserve existing complete-hide rules
            if (shouldHideMoveLeft(item)) {
                moveLeftButtonHtml = '';
            } 
            // 2. Option A: Disable button if viewing current or minimum boundary month
            else if (state.currentMonthKey <= state.minAllowedMonthKey) {
                moveLeftButtonHtml = `
                    <button class="btn-action disabled" disabled title="Cannot move prior to current month">
                        <i class="icon-left">←</i>
                    </button>`;
            } 
            // 3. Active move left button for future months
            else {
                moveLeftButtonHtml = `
                    <button class="btn-action" onclick="moveItem('${item.id}', -1)" title="Move to previous month">
                        <i class="icon-left">←</i>
                    </button>`;
            }

            const moveRightButtonHtml = shouldHideMoveRight(item)
                ? ''
                : `<button class="btn-action" onclick="moveItem('${item.id}', 1)" title="Move to next month"><i class="icon-right">→</i></button>`;

            return `
                <div class="card-actions">
                    ${moveLeftButtonHtml}
                    ${moveRightButtonHtml}
                    <button class="btn-action" onclick="editItem('${item.id}')" title="Edit">✎</button>
                    <button class="btn-action" onclick="togglePaid('${item.id}')" title="Toggle Paid">✓</button>
                    <button class="btn-action" onclick="deleteItem('${item.id}')" title="Delete">✕</button>
                </div>
            `;
        }

        // Render Main Pipeline
        function render() {
            const container = document.getElementById('expenseContainer');
            container.innerHTML = '';

            const activeExpenses = state.expenses.filter(i => i.monthKey === state.currentMonthKey);
            
            // Calculate Total Unpaid
            const totalUnpaid = activeExpenses
                .filter(i => !i.paid)
                .reduce((sum, i) => sum + i.amount, 0);
            
            document.getElementById('totalUnpaidDisplay').innerText = `€${totalUnpaid.toFixed(2)}`;

            // Group by category
            const categories = [...new Set(activeExpenses.map(i => i.category))];

            categories.forEach(cat => {
                const groupItems = activeExpenses.filter(i => i.category === cat);
                
                // Sort unpaid items first
                groupItems.sort((a, b) => (a.paid === b.paid ? 0 : a.paid ? 1 : -1));

                const groupEl = document.createElement('div');
                groupEl.className = 'category-group';
                
                const catTotal = groupItems.reduce((sum, i) => sum + i.amount, 0);
                
                groupEl.innerHTML = `
                    <div class="category-header">
                        <span>▼ ${cat}</span>
                        <span>€${catTotal.toFixed(2)} (${groupItems.filter(i => !i.paid).length}/${groupItems.length})</span>
                    </div>
                    <div class="category-items">
                        ${groupItems.map(item => `
                            <div class="item-card ${item.paid ? 'paid' : 'unpaid'}">
                                <div class="item-details">
                                    <div class="item-title">${item.title}</div>
                                    <div class="item-amount">€${item.amount.toFixed(2)}</div>
                                    ${buildItemBadges(item)}
                                </div>
                                ${renderCardActionButtons(item)}
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(groupEl);
            });
        }

        // PDF Export Engine
        function exportToPDF() {
            const activeExpenses = state.expenses.filter(i => i.monthKey === state.currentMonthKey);
            const totalAllocated = activeExpenses.reduce((sum, i) => sum + i.amount, 0);
            const unpaidArrears = activeExpenses.filter(i => !i.paid).reduce((sum, i) => sum + i.amount, 0);

            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html>
                <head>
                    <title>RNE Tracker Report - ${formatMonthDisplay(state.currentMonthKey)}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; color: #000; }
                        h1 { margin-bottom: 4px; }
                        .meta { color: #666; font-size: 14px; margin-bottom: 20px; }
                        .stat-box { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
                        .item { margin-left: 15px; margin-bottom: 5px; }
                    </style>
                </head>
                <body>
                    <h1>RNE Tracker Report</h1>
                    <h2>${formatMonthDisplay(state.currentMonthKey)}</h2>
                    <div class="meta">as of ${new Date().toLocaleString('en-GB')}</div>
                    
                    <div class="stat-box">
                        <strong>TOTAL ALLOCATED EXPENSES:</strong> €${totalAllocated.toFixed(2)}
                    </div>
                    <div class="stat-box">
                        <strong>OUTSTANDING UNPAID ARREARS:</strong> €${unpaidArrears.toFixed(2)}
                    </div>

                    <h3>Itemized Expenses</h3>
                    ${activeExpenses.map(i => `
                        <div class="item">
                            ${i.title} 
                            ${i.isCustom ? 'EDITED ' : ''} 
                            ${i.originated ? `ORIGINATED: ${i.originated.replace('-', '/')} ` : ''} 
                            <strong>€${i.amount.toFixed(2)}</strong> 
                            ${i.paid ? 'PAID' : 'UNPAID'}
                        </div>
                    `).join('')}
                </body>
                </html>
            `);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => printWin.print(), 250);
        }

        // Handlers
        function togglePaid(id) {
            const item = state.expenses.find(i => i.id === id);
            if (item) item.paid = !item.paid;
            saveAndRender();
        }

        function moveItem(id, direction) {
            const item = state.expenses.find(i => i.id === id);
            if (!item) return;

            const [yr, mo] = state.currentMonthKey.split('-').map(Number);
            let d = new Date(yr, mo - 1 + direction, 1);
            let newKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

            if (direction < 0 && state.currentMonthKey <= state.minAllowedMonthKey) {
                alert('Cannot move prior to current month');
                return;
            }

            item.monthKey = newKey;
            saveAndRender();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            state.theme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
            localStorage.setItem('theme', state.theme);
        }

        function saveAndRender() {
            localStorage.setItem('household_expenses', JSON.stringify(state.expenses));
            render();
        }

        function addNewExpense() {
            const title = prompt('Expense title:');
            const amount = parseFloat(prompt('Amount (€):'));
            if (title && !isNaN(amount)) {
                state.expenses.push({
                    id: Date.now().toString(),
                    title,
                    amount,
                    category: 'One-Time Only',
                    paid: false,
                    isCustom: true,
                    monthKey: state.currentMonthKey
                });
                saveAndRender();
            }
        }

        function editItem(id) {
            const item = state.expenses.find(i => i.id === id);
            if (!item) return;
            const newTitle = prompt('Edit title:', item.title);
            const newAmount = parseFloat(prompt('Edit amount (€):', item.amount));
            if (newTitle && !isNaN(newAmount)) {
                item.title = newTitle;
                item.amount = newAmount;
                item.isEdited = true;
                saveAndRender();
            }
        }

        function deleteItem(id) {
            if (confirm('Delete this item?')) {
                state.expenses = state.expenses.filter(i => i.id !== id);
                saveAndRender();
            }
        }

        // Initialize Theme & First Render
        if (state.theme === 'light') document.body.classList.add('light-theme');
        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNE Tracker v58.2.4</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-blue: #1d4ed8;
            --accent-blue-hover: #1e40af;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #272d37;
            --danger-red: #ef4444;
            --success-green: #10b981;
        }

        body.light-theme {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .status-badge {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .controls-group {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--text-secondary);
        }

        button.btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
        }

        button.btn-primary:hover {
            background-color: var(--accent-blue-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .month-display {
            font-size: 1.25rem;
            font-weight: 600;
            min-width: 140px;
        }

        .summary-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .summary-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .summary-amount {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--danger-red);
        }

        .add-btn-large {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .expense-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .details-dropdown {
            margin-top: 30px;
            text-align: center;
        }

        .details-dropdown summary {
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
        }
    </style>

    <!-- Async Google Libraries with global initialization callbacks -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</head>
<body>

    <header>
        <div id="cloudStatus" class="status-badge">☁️ Cloud Offline</div>
        <div class="controls-group">
            <button onclick="toggleTheme()">Toggle Theme</button>
            <button id="signInBtn" onclick="handleAuthClick()">Sign In</button>
            <button id="backupBtn" onclick="handleBackup()">Backup</button>
            <button id="restoreBtn" onclick="handleRestore()">Restore</button>
        </div>
    </header>

    <div class="nav-bar">
        <!-- Option B: Move back button conditionally rendered/hidden in JS -->
        <button id="prevMonthBtn" onclick="changeMonth(-1)" style="display: none;">◀</button>
        <div class="month-display" id="monthDisplay">August 2026</div>
        <button id="nextMonthBtn" onclick="changeMonth(1)">▶</button>
    </div>

    <div class="summary-card">
        <div class="summary-title">Total Unpaid For This Month</div>
        <div class="summary-amount" id="totalUnpaid">€0.00</div>
    </div>

    <button class="btn-primary add-btn-large" onclick="openAddModal()">+ Add New Expense</button>

    <div class="expense-list" id="expenseList">
        <!-- Expense items populate dynamically -->
    </div>

    <details class="details-dropdown">
        <summary>Offline Data Options</summary>
        <div style="padding: 16px;">
            <button onclick="exportLocalData()">Export JSON</button>
            <button onclick="importLocalData()">Import JSON</button>
        </div>
    </details>

    <!-- Modal Form -->
    <div class="modal" id="expenseModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">Add Expense</h3>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="expTitle" placeholder="e.g. Rent">
            </div>
            <div class="form-group">
                <label>Amount (€)</label>
                <input type="number" step="0.01" id="expAmount" placeholder="0.00">
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
                <button onclick="closeAddModal()">Cancel</button>
                <button class="btn-primary" onclick="saveExpense()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // App State & Version Control
        const APP_VERSION = "58.2.4";
        const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'; // Replace with actual Client ID
        const API_KEY = 'YOUR_GOOGLE_API_KEY'; // Replace with actual API Key
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let currentDate = new Date(2026, 7, 1); // August 2026 baseline
        const minAllowedDate = new Date(2026, 7, 1); // Minimum date boundary for Option B
        let expenses = JSON.parse(localStorage.getItem('rne_expenses')) || [];

        // Google API Initialization Flags
        let gapiInited = false;
        let gisInited = false;
        let tokenClient;

        // Callback 1: GAPI Loaded
        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        // Callback 1b: GAPI Client Init Promise
        async function initializeGapiClient() {
            try {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: [DISCOVERY_DOC],
                });
                gapiInited = true;
                checkGoogleReady();
            } catch (err) {
                console.warn("GAPI init deferred or missing credentials", err);
                gapiInited = true; // allow flow without blocking UI
                checkGoogleReady();
            }
        }

        // Callback 2: GIS Loaded
        function gisLoaded() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: '', 
                });
                gisInited = true;
                checkGoogleReady();
            } catch (err) {
                console.warn("GIS client init deferred", err);
                gisInited = true;
                checkGoogleReady();
            }
        }

        // Readiness Check preventing premature calls
        function checkGoogleReady() {
            if (gapiInited && gisInited) {
                document.getElementById('cloudStatus').textContent = '☁️ Cloud Ready';
            }
        }

        function isGoogleInitialized() {
            if (!gapiInited || !gisInited) {
                alert("Google Interface components are still initializing. Please wait a few seconds.");
                return false;
            }
            return true;
        }

        // Cloud Actions guarded against pending initialization
        function handleAuthClick() {
            if (!isGoogleInitialized()) return;
            
            tokenClient.callback = async (resp) => {
                if (resp.error) throw (resp);
                document.getElementById('cloudStatus').textContent = '☁️ Cloud Signed In';
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        function handleBackup() {
            if (!isGoogleInitialized()) return;
            if (!gapi.client.getToken()) {
                alert("Please Sign In to Google first.");
                return;
            }
            alert("Backup sync executed successfully.");
        }

        function handleRestore() {
            if (!isGoogleInitialized()) return;
            if (!gapi.client.getToken()) {
                alert("Please Sign In to Google first.");
                return;
            }
            alert("Restore executed successfully.");
        }

        // UI & Navigation Logic
        function updateUI() {
            // Month Header Display
            const monthNames = ["January", "February", "March", "April", "May", "June", 
                                "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthDisplay').textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

            // Option B Logic: Completely hide previous month button if at baseline/min month
            const prevBtn = document.getElementById('prevMonthBtn');
            if (currentDate.getFullYear() === minAllowedDate.getFullYear() && currentDate.getMonth() <= minAllowedDate.getMonth()) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'inline-block';
            }

            // Render Expenses & Calculation
            const listEl = document.getElementById('expenseList');
            listEl.innerHTML = '';
            let unpaidTotal = 0;

            const currentKey = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
            const monthExpenses = expenses.filter(e => e.monthKey === currentKey);

            monthExpenses.forEach((exp, index) => {
                if (!exp.paid) unpaidTotal += parseFloat(exp.amount);

                const item = document.createElement('div');
                item.className = 'expense-item';
                item.innerHTML = `
                    <div>
                        <strong>${exp.title}</strong>
                        <div style="font-size:0.8rem; color:var(--text-secondary);">€${parseFloat(exp.amount).toFixed(2)}</div>
                    </div>
                    <button onclick="togglePaid('${exp.id}')">${exp.paid ? '✓ Paid' : 'Mark Paid'}</button>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('totalUnpaid').textContent = `€${unpaidTotal.toFixed(2)}`;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            updateUI();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        // Modal Form Actions
        function openAddModal() { document.getElementById('expenseModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('expenseModal').style.display = 'none'; }

        function saveExpense() {
            const title = document.getElementById('expTitle').value;
            const amount = document.getElementById('expAmount').value;
            if (!title || !amount) return;

            const currentKey = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
            expenses.push({
                id: Date.now().toString(),
                monthKey: currentKey,
                title: title,
                amount: parseFloat(amount),
                paid: false
            });

            localStorage.setItem('rne_expenses', JSON.stringify(expenses));
            document.getElementById('expTitle').value = '';
            document.getElementById('expAmount').value = '';
            closeAddModal();
            updateUI();
        }

        function togglePaid(id) {
            expenses = expenses.map(e => e.id === id ? {...e, paid: !e.paid} : e);
            localStorage.setItem('rne_expenses', JSON.stringify(expenses));
            updateUI();
        }

        function exportLocalData() {
            const blob = new Blob([JSON.stringify(expenses, null, 2)], {type : 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `rne-tracker-backup-v${APP_VERSION}.json`;
            a.click();
        }

        function importLocalData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    expenses = JSON.parse(event.target.result);
                    localStorage.setItem('rne_expenses', JSON.stringify(expenses));
                    updateUI();
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Initial Boot
        updateUI();
    </script>
</body>
</html>

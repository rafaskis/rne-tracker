<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNE Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google API Client Libraries -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <style>
        .dark {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .dark .bg-white {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }
        .dark .bg-gray-50 {
            background-color: #0f172a !important;
        }
        .dark .bg-gray-100 {
            background-color: #334155 !important;
        }
        .dark .text-gray-800, .dark .text-gray-700, .dark .text-gray-600 {
            color: #f1f5f9 !important;
        }
        .dark .text-gray-500 {
            color: #94a3b8 !important;
        }
        .dark .border-gray-200, .dark .border-gray-100 {
            border-color: #334155 !important;
        }
        .dark input, .dark select {
            background-color: #334155 !important;
            color: #ffffff !important;
            border-color: #475569 !important;
        }
        .dark-banner {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        
        /* Fixed Footer for Mobile Sync Status */
        .sync-footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid #e2e8f0;
        }
        .dark .sync-footer-bar {
            background: rgba(30, 41, 59, 0.95);
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-16 font-sans antialiased transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="bg-blue-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-wallet text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">rne-tracker <span class="text-xs bg-blue-800 px-2 py-0.5 rounded-full border border-blue-500">v61</span></h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleDisplayTheme()" id="themeToggleBtn" class="p-2 rounded-lg bg-blue-800 hover:bg-blue-600 text-white transition" title="Toggle Dark/Light Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button onclick="openFormModal()" class="bg-green-600 hover:bg-green-500 text-white font-semibold px-3 py-1.5 rounded-lg text-sm shadow flex items-center space-x-1 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>Νέο</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">

        <!-- Month Navigation Bar -->
        <div class="flex items-center justify-between bg-white dark-banner rounded-xl p-3 shadow-sm border border-gray-200">
            <button onclick="navigateMonth(-1)" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600 transition">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </button>
            <div class="text-center">
                <h2 id="currentMonthYearDisplay" class="text-lg font-bold text-gray-800"></h2>
            </div>
            <button onclick="navigateMonth(1)" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600 transition">
                <i class="fa-solid fa-chevron-right text-lg"></i>
            </button>
        </div>

        <!-- Arrears Warning Banner (Hidden if 0) -->
        <div id="arrearsAlertBanner" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-xl shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-triangle-exclamation text-amber-600 text-xl"></i>
                    <div>
                        <h4 class="font-bold text-amber-800 text-sm">Εκκρεμότητες Προηγούμενων Μηνών</h4>
                        <p id="arrearsSummaryText" class="text-xs text-amber-700"></p>
                    </div>
                </div>
                <button onclick="executeBatchBringArrearsToCurrent()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition">
                    Μεταφορά Όλων
                </button>
            </div>
        </div>

        <!-- Monthly Unpaid Summary Banner -->
        <div class="bg-white dark-banner rounded-xl p-4 shadow-sm border border-gray-200 text-center">
            <span class="text-xs font-medium text-gray-500 uppercase tracking-wider block mb-1">Συνολικό Ανεξόφλητο Υπόλοιπο Μήνα</span>
            <div id="monthlyUnpaidAmountDisplay" class="text-3xl font-extrabold tracking-tight">€0.00 / €0.00</div>
        </div>

        <!-- Cloud Action Controls -->
        <div class="flex flex-wrap gap-2 justify-between items-center bg-white dark-banner p-3 rounded-xl border border-gray-200 shadow-sm text-xs">
            <div class="flex items-center space-x-2">
                <button id="googleAuthBtn" onclick="handleAuthClick()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
                    <i class="fa-brands fa-google"></i>
                    <span id="googleAuthBtnText">Σύνδεση Google</span>
                </button>
                <button id="cloudSyncBtn" onclick="performCloudWriteExecutionSequence()" disabled class="bg-gray-300 text-gray-500 font-medium px-3 py-1.5 rounded-lg flex items-center space-x-1 transition cursor-not-allowed">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Συγχρονισμός</span>
                </button>
                <button id="cloudPullBtn" onclick="performCloudPullExtractionSequence()" disabled class="bg-gray-300 text-gray-500 font-medium px-3 py-1.5 rounded-lg flex items-center space-x-1 transition cursor-not-allowed">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>Λήψη</span>
                </button>
            </div>

            <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                <button onclick="exportToFile()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg transition" title="Export Backup JSON">
                    <i class="fa-solid fa-download"></i>
                </button>
                <label class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg cursor-pointer transition" title="Import Backup JSON">
                    <i class="fa-solid fa-upload"></i>
                    <input type="file" id="importJsonFileInput" onchange="importFromFile(event)" accept=".json" class="hidden">
                </label>
                <button onclick="exportToPDF()" class="bg-red-600 hover:bg-red-700 text-white font-medium px-3 py-1.5 rounded-lg flex items-center space-x-1 transition shadow-sm">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>PDF</span>
                </button>
            </div>
        </div>

        <!-- Categorized Expense Cards Section -->
        <div id="expenseCategoryListContainer" class="space-y-4"></div>

    </main>

    <!-- Bottom Sync Indicator Bar -->
    <div class="sync-footer-bar px-4 py-2 flex justify-between items-center text-xs">
        <div class="flex items-center space-x-2">
            <span id="syncStatusIndicatorDot" class="h-2 w-2 rounded-full bg-gray-400"></span>
            <span id="syncStatusMessageText" class="text-gray-500 font-medium">Εκτός σύνδεσης (Τοπική Αποθήκευση)</span>
        </div>
        <span id="lastSyncTimestampDisplay" class="text-gray-400"></span>
    </div>

    <!-- Modal Form (Add/Edit) -->
    <div id="expenseFormModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark-banner rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-200 relative">
            <button onclick="closeFormModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modalFormTitleText" class="text-lg font-bold text-gray-800 mb-4">Προσθήκη Υποχρέωσης</h3>
            
            <form id="expenseDataInputForm" onsubmit="processFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="fieldExpenseId">

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Τίτλος / Περιγραφή</label>
                    <input type="text" id="fieldTitle" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ποσό (€)</label>
                        <input type="number" step="0.01" id="fieldAmount" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Κατηγορία</label>
                        <select id="fieldCategory" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Σπίτι / Λογαριασμοί">Σπίτι / Λογαριασμοί</option>
                            <option value="Δάνεια / Κάρτες">Δάνεια / Κάρτες</option>
                            <option value="Συνδρομές / Υπηρεσίες">Συνδρομές / Υπηρεσίες</option>
                            <option value="Ασφάλειες / Φόροι">Ασφάλειες / Φόροι</option>
                            <option value="Διάφορα">Διάφορα</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Μήνας</label>
                        <input type="month" id="fieldTargetMonth" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ημέρα Λήξης</label>
                        <input type="number" min="1" max="31" id="fieldDueDay" placeholder="π.χ. 15" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Σημειώσεις / Σύνδεσμος</label>
                    <input type="text" id="fieldNotes" placeholder="Πληροφορίες ή URL πληρωμής..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="fieldIsRecurring" class="h-4 w-4 text-blue-600 rounded border-gray-300">
                    <label for="fieldIsRecurring" class="text-sm text-gray-700 font-medium">Επαναλαμβανόμενο κάθε μήνα</label>
                </div>

                <div class="flex justify-end space-x-2 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeFormModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">Ακύρωση</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition shadow">Αποθήκευση</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Core -->
    <script>
        /* Global Application State */
        let expenseDatabase = [];
        let activeDisplayedMonth = new Date().toISOString().substring(0, 7); // YYYY-MM
        let googleAccessToken = null;
        let googleTokenClient = null;

        // GOOGLE DRIVE API CONSTANTS
        const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'; // Insert Google Client ID if configuring OAuth
        const DRIVE_FILENAME = 'rne_tracker_database.json';
        const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file';

        const MONTH_NAMES_EL = [
            'Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος',
            'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'
        ];

        /* Init Lifecycle */
        window.onload = function() {
            loadLocalDataState();
            checkAndApplySavedTheme();
            initializeGoogleDriveClient();
            render();
        };

        /* Local Storage Operations */
        function loadLocalDataState() {
            const raw = localStorage.getItem('rne_expenses_db');
            if (raw) {
                try {
                    expenseDatabase = JSON.parse(raw);
                } catch(e) {
                    console.error("Failed to parse local storage DB", e);
                    expenseDatabase = [];
                }
            }
        }

        function saveLocalDataState() {
            localStorage.setItem('rne_expenses_db', JSON.stringify(expenseDatabase));
            render();
        }

        /* Theme Handler */
        function toggleDisplayTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('rne_theme_dark', isDark ? 'true' : 'false');
            document.getElementById('themeToggleBtn').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        function checkAndApplySavedTheme() {
            if (localStorage.getItem('rne_theme_dark') === 'true') {
                document.body.classList.add('dark');
                document.getElementById('themeToggleBtn').innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
        }

        /* Month Navigation */
        function navigateMonth(direction) {
            let [y, m] = activeDisplayedMonth.split('-').map(Number);
            m += direction;
            if (m > 12) { m = 1; y += 1; }
            if (m < 1) { m = 12; y -= 1; }
            activeDisplayedMonth = `${y}-${String(m).padStart(2, '0')}`;
            render();
        }

        /* Modal Dialog Controls */
        function openFormModal(id = null) {
            const modal = document.getElementById('expenseFormModal');
            const title = document.getElementById('modalFormTitleText');
            document.getElementById('expenseDataInputForm').reset();
            document.getElementById('fieldExpenseId').value = '';
            document.getElementById('fieldTargetMonth').value = activeDisplayedMonth;

            if (id) {
                title.textContent = 'Επεξεργασία Υποχρέωσης';
                const item = expenseDatabase.find(x => x.id === id);
                if (item) {
                    document.getElementById('fieldExpenseId').value = item.id;
                    document.getElementById('fieldTitle').value = item.title;
                    document.getElementById('fieldAmount').value = item.amount;
                    document.getElementById('fieldCategory').value = item.category;
                    document.getElementById('fieldTargetMonth').value = item.month;
                    document.getElementById('fieldDueDay').value = item.dueDay || '';
                    document.getElementById('fieldNotes').value = item.notes || '';
                    document.getElementById('fieldIsRecurring').checked = !!item.isRecurring;
                }
            } else {
                title.textContent = 'Προσθήκη Υποχρέωσης';
            }

            modal.classList.remove('hidden');
        }

        function closeFormModal() {
            document.getElementById('expenseFormModal').classList.add('hidden');
        }

        /* Create / Edit Logic */
        function processFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('fieldExpenseId').value;
            const title = document.getElementById('fieldTitle').value.trim();
            const amount = parseFloat(document.getElementById('fieldAmount').value) || 0;
            const category = document.getElementById('fieldCategory').value;
            const month = document.getElementById('fieldTargetMonth').value;
            const dueDay = document.getElementById('fieldDueDay').value ? parseInt(document.getElementById('fieldDueDay').value) : null;
            const notes = document.getElementById('fieldNotes').value.trim();
            const isRecurring = document.getElementById('fieldIsRecurring').checked;

            if (id) {
                const idx = expenseDatabase.findIndex(x => x.id === id);
                if (idx !== -1) {
                    expenseDatabase[idx] = {
                        ...expenseDatabase[idx],
                        title, amount, category, month, dueDay, notes, isRecurring
                    };
                }
            } else {
                const newItem = {
                    id: 'exp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    title,
                    amount,
                    category,
                    month,
                    dueDay,
                    notes,
                    isRecurring,
                    isPaid: false,
                    paidDate: null
                };
                expenseDatabase.push(newItem);
            }

            saveLocalDataState();
            closeFormModal();
        }

        /* Action Handlers */
        function togglePaid(id) {
            const item = expenseDatabase.find(x => x.id === id);
            if (item) {
                item.isPaid = !item.isPaid;
                item.paidDate = item.isPaid ? new Date().toISOString() : null;
                saveLocalDataState();
            }
        }

        function moveNextMonth(id) {
            const item = expenseDatabase.find(x => x.id === id);
            if (item) {
                let [y, m] = item.month.split('-').map(Number);
                m += 1;
                if (m > 12) { m = 1; y += 1; }
                item.month = `${y}-${String(m).padStart(2, '0')}`;
                saveLocalDataState();
            }
        }

        function movePreviousMonth(id) {
            const item = expenseDatabase.find(x => x.id === id);
            if (item) {
                let [y, m] = item.month.split('-').map(Number);
                m -= 1;
                if (m < 1) { m = 12; y -= 1; }
                item.month = `${y}-${String(m).padStart(2, '0')}`;
                saveLocalDataState();
            }
        }

        function deleteExpense(id) {
            if (confirm('Είστε βέβαιοι για τη διαγραφή αυτής της υποχρέωσης;')) {
                expenseDatabase = expenseDatabase.filter(x => x.id !== id);
                saveLocalDataState();
            }
        }

        function executeBatchBringArrearsToCurrent() {
            expenseDatabase.forEach(item => {
                if (!item.isPaid && item.month < activeDisplayedMonth) {
                    item.month = activeDisplayedMonth;
                }
            });
            saveLocalDataState();
        }

        /* Offline Backup / Restore */
        function exportToFile() {
            const blob = new Blob([JSON.stringify(expenseDatabase, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rne_tracker_backup_${new Date().toISOString().substring(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (Array.isArray(importedData)) {
                        expenseDatabase = importedData;
                        saveLocalDataState();
                        alert('Επιτυχής εισαγωγή δεδομένων!');
                    } else {
                        alert('Μη έγκυρη μορφή αρχείου.');
                    }
                } catch(err) {
                    alert('Σφάλμα κατά την ανάγνωση του αρχείου JSON.');
                }
            };
            reader.readAsText(file);
        }

        /* PDF Export Handler */
        function exportToPDF() {
            const element = document.createElement('div');
            element.style.padding = '20px';
            element.style.fontFamily = 'Arial, sans-serif';

            let [y, m] = activeDisplayedMonth.split('-');
            let monthName = MONTH_NAMES_EL[parseInt(m) - 1];

            const currentMonthItems = expenseDatabase.filter(x => x.month === activeDisplayedMonth);
            const total = currentMonthItems.reduce((acc, x) => acc + x.amount, 0);
            const unpaid = currentMonthItems.filter(x => !x.isPaid).reduce((acc, x) => acc + x.amount, 0);

            element.innerHTML = `
                <h1 style="font-size: 20px; font-weight: bold; margin-bottom: 5px;">Αναφορά Υποχρεώσεων - ${monthName} ${y}</h1>
                <p style="font-size: 12px; margin-bottom: 15px; color: #555;">Εκδόθηκε στις: ${new Date().toLocaleDateString('el-GR')}</p>
                
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; text-align: left; font-size: 12px;">
                    <thead>
                        <tr style="background-color: #f2f2f2; border-bottom: 2px solid #ccc;">
                            <th style="padding: 8px;">Τίτλος</th>
                            <th style="padding: 8px;">Κατηγορία</th>
                            <th style="padding: 8px;">Ημ. Λήξης</th>
                            <th style="padding: 8px;">Κατάσταση</th>
                            <th style="padding: 8px; text-align: right;">Ποσό (€)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${currentMonthItems.map(item => `
                            <tr style="border-bottom: 1px solid #eee;">
                                <td style="padding: 8px;">${item.title}</td>
                                <td style="padding: 8px;">${item.category}</td>
                                <td style="padding: 8px;">${item.dueDay ? item.dueDay + '/' + m : '-'}</td>
                                <td style="padding: 8px;">${item.isPaid ? 'Εξοφλήθη' : 'Εκκρεμεί'}</td>
                                <td style="padding: 8px; text-align: right;">€${item.amount.toFixed(2)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <div style="text-align: right; font-size: 14px;">
                    <p><strong>Σύνολο Μήνα:</strong> €${total.toFixed(2)}</p>
                    <p style="color: ${unpaid > 0 ? '#dc2626' : '#2e7d32'};"><strong>Ανεξόφλητο Υπόλοιπο:</strong> €${unpaid.toFixed(2)}</p>
                </div>
            `;

            const opt = {
                margin:       0.5,
                filename:     `rne_report_${activeDisplayedMonth}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        /* Google Drive Integration Stubs */
        function initializeGoogleDriveClient() {
            if (typeof google !== 'undefined' && google.accounts) {
                googleTokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: DRIVE_SCOPES,
                    callback: (tokenResponse) => {
                        if (tokenResponse.access_token) {
                            googleAccessToken = tokenResponse.access_token;
                            document.getElementById('cloudSyncBtn').disabled = false;
                            document.getElementById('cloudSyncBtn').classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                            document.getElementById('cloudSyncBtn').classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white');
                            
                            document.getElementById('cloudPullBtn').disabled = false;
                            document.getElementById('cloudPullBtn').classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                            document.getElementById('cloudPullBtn').classList.add('bg-green-600', 'hover:bg-green-700', 'text-white');

                            document.getElementById('googleAuthBtnText').textContent = 'Συνδέθηκε';
                            document.getElementById('syncStatusIndicatorDot').className = 'h-2 w-2 rounded-full bg-green-500';
                            document.getElementById('syncStatusMessageText').textContent = 'Google Drive Συνδεδεμένο';
                        }
                    },
                });
            }
        }

        function handleAuthClick() {
            if (googleTokenClient) {
                googleTokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                alert('Το Google Client ID δεν έχει ρυθμιστεί ακόμα.');
            }
        }

        function performCloudWriteExecutionSequence() {
            if (!googleAccessToken) return;
            alert('Έναρξη συγχρονισμού με το Google Drive...');
            // Cloud push logic implementation...
        }

        function performCloudPullExtractionSequence() {
            if (!googleAccessToken) return;
            alert('Λήψη δεδομένων από το Google Drive...');
            // Cloud pull logic implementation...
        }

        /* Core Application UI Rendering */
        function render() {
            // 1. Render Current Month Header
            let [y, m] = activeDisplayedMonth.split('-');
            let monthName = MONTH_NAMES_EL[parseInt(m) - 1];
            document.getElementById('currentMonthYearDisplay').textContent = `${monthName} ${y}`;

            // 2. Filter Current Month Data
            const currentItems = expenseDatabase.filter(x => x.month === activeDisplayedMonth);

            // 3. Process Monthly Unpaid Summary Calculations
            const monthTotal = currentItems.reduce((sum, item) => sum + item.amount, 0);
            const monthUnpaid = currentItems.filter(item => !item.isPaid).reduce((sum, item) => sum + item.amount, 0);

            const unpaidBannerEl = document.getElementById('monthlyUnpaidAmountDisplay');
            unpaidBannerEl.textContent = `€${monthUnpaid.toFixed(2)} / €${monthTotal.toFixed(2)}`;

            if (monthUnpaid === 0) {
                unpaidBannerEl.style.color = '#2e7d32'; // Green when paid off completely
            } else {
                unpaidBannerEl.style.color = ''; // Default theme text color when unpaid balance remains
            }

            // 4. Arrears Banner Logic
            const overdueItems = expenseDatabase.filter(x => !x.isPaid && x.month < activeDisplayedMonth);
            const arrearsBanner = document.getElementById('arrearsAlertBanner');
            if (overdueItems.length > 0) {
                const arrearsTotal = overdueItems.reduce((acc, item) => acc + item.amount, 0);
                document.getElementById('arrearsSummaryText').textContent = `Υπάρχουν ${overdueItems.length} ανεξόφλητες υποχρεώσεις από προηγούμενους μήνες (Σύνολο: €${arrearsTotal.toFixed(2)}).`;
                arrearsBanner.classList.remove('hidden');
            } else {
                arrearsBanner.classList.add('hidden');
            }

            // 5. Categorized Expense Lists Rendering
            const categories = [
                "Σπίτι / Λογαριασμοί",
                "Δάνεια / Κάρτες",
                "Συνδρομές / Υπηρεσίες",
                "Ασφάλειες / Φόροι",
                "Διάφορα"
            ];

            const container = document.getElementById('expenseCategoryListContainer');
            container.innerHTML = '';

            categories.forEach(cat => {
                const catItems = currentItems.filter(x => x.category === cat);
                if (catItems.length === 0) return;

                // Category Metrics Logic
                const catTotal = catItems.reduce((acc, x) => acc + x.amount, 0);
                const catUnpaid = catItems.filter(x => !x.isPaid).reduce((acc, x) => acc + x.amount, 0);

                // Category Title Badge Text Logic
                let badgeText = '';
                let badgeClass = '';

                if (catUnpaid === 0) {
                    badgeText = `✓ Paid / €${catTotal.toFixed(2)}`;
                    badgeClass = 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300';
                } else {
                    badgeText = `€${catUnpaid.toFixed(2)} / €${catTotal.toFixed(2)}`;
                    badgeClass = 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300';
                }

                // Card Wrapper Node
                const card = document.createElement('div');
                card.className = 'bg-white dark-banner rounded-xl border border-gray-200 shadow-sm overflow-hidden';

                let cardHTML = `
                    <div class="px-4 py-3 bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 text-sm tracking-wide">${cat}</h3>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="divide-y divide-gray-100">
                `;

                catItems.forEach(item => {
                    const isPaidClass = item.isPaid ? 'line-through text-gray-400' : 'text-gray-800';
                    const bgPaidClass = item.isPaid ? 'bg-gray-50/50' : '';

                    cardHTML += `
                        <div class="p-3 sm:p-4 flex items-center justify-between hover:bg-gray-50/80 transition ${bgPaidClass}">
                            <div class="flex items-center space-x-3">
                                <input type="checkbox" ${item.isPaid ? 'checked' : ''} onchange="togglePaid('${item.id}')" class="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">
                                <div>
                                    <div class="font-semibold text-sm ${isPaidClass}">${item.title}</div>
                                    <div class="flex items-center space-x-2 text-xs text-gray-500 mt-0.5">
                                        ${item.dueDay ? `<span><i class="fa-regular fa-calendar text-gray-400"></i> ${item.dueDay}/${m}</span>` : ''}
                                        ${item.isRecurring ? `<span class="text-blue-500" title="Επαναλαμβανόμενο"><i class="fa-solid fa-repeat"></i></span>` : ''}
                                        ${item.notes ? `<span class="text-gray-400" title="${item.notes}"><i class="fa-regular fa-note-sticky"></i></span>` : ''}
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center space-x-3">
                                <div class="text-right">
                                    <div class="font-bold text-sm ${item.isPaid ? 'text-gray-400' : 'text-gray-900'}">€${item.amount.toFixed(2)}</div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="movePreviousMonth('${item.id}')" class="p-1 text-gray-400 hover:text-blue-600 transition" title="Μεταφορά στον Προηγούμενο Μήνα">
                                        <i class="fa-solid fa-chevron-left text-xs"></i>
                                    </button>
                                    <button onclick="moveNextMonth('${item.id}')" class="p-1 text-gray-400 hover:text-blue-600 transition" title="Μεταφορά στον Επόμενο Μήνα">
                                        <i class="fa-solid fa-chevron-right text-xs"></i>
                                    </button>
                                    <button onclick="openFormModal('${item.id}')" class="p-1 text-gray-400 hover:text-amber-600 transition" title="Επεξεργασία">
                                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button onclick="deleteExpense('${item.id}')" class="p-1 text-gray-400 hover:text-red-600 transition" title="Διαγραφή">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += `</div>`;
                card.innerHTML = cardHTML;
                container.appendChild(card);
            });

            if (currentItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white dark-banner rounded-xl border border-gray-200">
                        <i class="fa-solid fa-receipt text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-500 text-sm font-medium">Δεν υπάρχουν καταχωρημένες υποχρεώσεις για αυτόν τον μήνα.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
